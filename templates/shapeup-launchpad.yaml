name: Shape Up Launchpad
readme: |
  # Startup Shape Up Launchpad

  This template mirrors the automation provided by the legacy `bootstrap-project.sh`
  script. Applying it will:

  - Create a GitHub Project v2 with Shape Up aware custom fields
  - Sync the full Shape Up label palette (spec, appetite, and work streams)
  - Provision 15 roadmap milestones that track each Shape Up / Startup step
  - Open a spec issue for every step, including doc context metadata, field values,
    milestone alignment, and default labels

  Each issue is intended to be refined in spec-kit style and will automatically be
  added to the project with the right custom-field state once project field support
  is enabled in `gh-templater`.
