      > Capture the problem framing, appetite, solution outline, and risks before build.

      - [ ] Problem & user value
      - [ ] Appetite (shape up time budget)
      - [ ] Solution outline & risks
      - [ ] Rabbit holes + no-gos
      - [ ] Success metrics / guardrails

      ## 🤖 Build Partner
      Use Codex or your preferred AI pair to convert the spec into actionable tasks.
    labels: [spec, spec:draft, shapeup:pitch, work:feature, priority:now, spec:launchpad]
    milestone: Step 01 – Vision & Alignment
    fields:
