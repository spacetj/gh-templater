name: Production-Ready Go Microservice
project:
  readme: |
    # Production-Ready Go Microservice

    This template mirrors the 17-step checklist in `docs/microservice/`. Applying it will:

    - Create milestones for every checklist step so you can track readiness end-to-end.
    - Sync a microservice-specific label palette covering design, automation, security, and compliance.
    - Provision custom fields that capture readiness stage, engineering discipline, docs links, risk, and target ship dates.
    - Open an issue for each step with links back to the detailed markdown briefs.

    ## 🔭 Recommended Views

    1. **Readiness Roadmap** (Roadmap view)
       - Group by **Milestone** to see progress across Steps 01–17.
       - Plot by **Target Ship Date** to visualize when each capability lands.
    2. **Hardening Board** (Board view)
       - Columns: Backlog, Design, Implementation, Automation, Operations Ready, On-Call Ready, Done.
       - Group rows by **Readiness Stage** to spot bottlenecks.
    3. **Compliance Table** (Table view)
       - Show **Discipline**, **Risk Level**, and **Docs Link** fields for faster reviews.

    Link each generated card to its owning engineer, keep docs updated, and feed incident learnings back into the checklist to stay production-ready.
  fields:
    - name: Readiness Stage
      data_type: SINGLE_SELECT
      description: Macro phase of the readiness journey
      options:
        - name: Design & Architecture
          color: BLUE
        - name: Implementation
          color: GREEN
        - name: Automation & Quality
          color: ORANGE
        - name: Operational Hardening
          color: PURPLE
        - name: On-Call & Compliance
          color: GRAY
    - name: Discipline
      data_type: SINGLE_SELECT
      description: Primary engineering area responsible
      options:
        - name: Architecture
          color: BLUE
        - name: API
          color: TEAL
        - name: Dependencies
          color: GREEN
        - name: Configuration
          color: BROWN
        - name: Security
          color: RED
        - name: Testing
          color: ORANGE
        - name: Quality
          color: PINK
        - name: CI/CD
          color: BLUE
        - name: Secrets
          color: PURPLE
        - name: Observability
          color: YELLOW
        - name: Health & Probes
          color: GREEN
        - name: Resiliency
          color: GREEN
        - name: Fault Tolerance
          color: GRAY
        - name: Deployment
          color: BLUE
        - name: Documentation
          color: PURPLE
        - name: Incident Response
          color: ORANGE
        - name: Compliance
          color: BROWN
    - name: Risk Level
      data_type: SINGLE_SELECT
      description: Risk rating for leadership reviews
      options:
        - name: High
          color: RED
        - name: Medium
          color: ORANGE
        - name: Low
          color: GREEN
    - name: Target Ship Date
      data_type: DATE
      description: Target completion date for the task
    - name: Docs Link
      data_type: TEXT
      description: Reference to supporting documents

