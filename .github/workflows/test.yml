name: Test

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Download modules
        run: go mod download
      - name: Run tests
        env:
          GH_TEMPLATER_TOKEN: ${{ secrets.GH_TEMPLATER_TOKEN }}
        run: go test ./...
