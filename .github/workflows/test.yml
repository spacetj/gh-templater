name: Test

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Download modules
        run: go mod download
      - name: Run unit tests (excluding e2e)
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v "internal/e2e")
          if [ -n "$pkgs" ]; then
            go test $pkgs
          fi

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      GH_TEMPLATER_E2E_PROJECT: gh-templater e2e ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Download modules
        run: go mod download
      - name: Run E2E tests
        env:
          GH_TEMPLATER_TOKEN: ${{ secrets.GH_TEMPLATER_TOKEN }}
        run: go test ./internal/e2e -run TestApplyTemplateE2E -count=1

      - name: Cleanup E2E artifacts
        if: always()
        env:
          GH_TEMPLATER_TOKEN: ${{ secrets.GH_TEMPLATER_TOKEN }}
        run: |
          if [ -z "${GH_TEMPLATER_TOKEN}" ]; then
            echo "GH_TEMPLATER_TOKEN not set; skipping cleanup"
            exit 0
          fi
          export GH_TOKEN="${GH_TEMPLATER_TOKEN}"
          export GITHUB_TOKEN="${GH_TEMPLATER_TOKEN}"
          gh extension install . >/dev/null 2>&1 || gh extension upgrade gh-templater >/dev/null 2>&1 || true
          gh templater delete --org spacetj --project "${GH_TEMPLATER_E2E_PROJECT}" --issues-repo spacetj/gh-templater --template templates/e2e-smoke.yaml || true
